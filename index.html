<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥品費用計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-labelledby="page-title">
    <h1 id="page-title">藥品費用計算</h1>

    <form id="cost-form" novalidate>
      <label class="input-label" for="cost">
        <span
          class="tooltip-trigger"
          tabindex="0"
          aria-describedby="input-format-tooltip"
        >請貼上複製的藥品單文字</span>
        <span id="input-format-tooltip" class="tooltip input-tooltip" role="tooltip">只適用在批價中複製的藥單，不接受其他藥單格式</span>
      </label>
      <textarea
        id="cost"
        name="cost"
        autocomplete="off"
        aria-describedby="message"
        rows="4"
      ></textarea>
      <div class="button-group">
        <button type="submit">計算</button>
        <button id="clear-button" class="secondary-button" type="button">清除</button>
      </div>
    </form>

    <div id="message" class="message" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
